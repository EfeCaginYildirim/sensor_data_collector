# Sensor Data Collector — example configuration
# Copy to config/collector.properties (git-ignored) and adjust.
# Every key can be overridden by an environment variable: SDC_ + key in upper case with
# '.' and '-' replaced by '_', e.g. api.password -> SDC_API_PASSWORD.
# Durations are ISO-8601: PT30S = 30 seconds, PT10M = 10 minutes, P3D = 3 days.

# --- Vendor API (these values match `java -jar ... fake-api`) ---
api.base-url=http://127.0.0.1:8080/api/v1
api.username=demo
api.password=demo
api.connect-timeout=PT10S
api.request-timeout=PT60S
api.max-attempts=3
# Upper bound of parallel requests; keep it below the vendor's rate limit.
api.max-concurrent-requests=8

# --- What to collect ---
collection.plant-id=1
collection.monitor-ids=1001,1002,1003,1004,1005,1006
# First day collected for a monitor that has no data yet (UTC).
collection.initial-start-date=2025-01-01
# Each run re-fetches this much before the watermark to pick up late or corrected samples.
collection.overlap=P3D
# Longest time range requested in one API call.
collection.chunk=P30D
# Monitors not finished within this budget are reported as failed and retried next run.
collection.run-deadline=PT30M

# --- Storage ---
# Embedded H2 file (no server, no credentials); the data lives in data/collector.mv.db:
#db.url=jdbc:h2:file:./data/collector
#
# Or SQL Server (omit db.url entirely and pass --in-memory to try without any database):
# useBulkCopyForBatchInsert lets the driver turn batched INSERTs into bulk copies.
#db.url=jdbc:sqlserver://localhost:1433;databaseName=Sensors;encrypt=true;useBulkCopyForBatchInsert=true
#db.user=collector
#db.password=set-via-SDC_DB_PASSWORD

# --- Output ---
#output.snapshot-dir=data_files
#output.log-dir=logs

# --- Daemon schedule ---
schedule.daily-time=09:00
schedule.zone=Europe/Istanbul
