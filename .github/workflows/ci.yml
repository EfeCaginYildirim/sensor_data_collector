name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, test and measure coverage
        run: mvn -B verify

      - name: Javadoc
        run: mvn -B javadoc:javadoc

      - name: Smoke-test the packaged jar
        run: java -jar target/sensor-data-collector-*-SNAPSHOT.jar demo --days 30 --monitors 3

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
