# End-to-end environment: SQL Server + fake vendor API + collector daemon.
#
#   docker compose up --build
#
# The collector runs once at start (--run-now) and then daily. Inspect the data with e.g.
#   docker compose exec db /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SA_PASSWORD" \
#     -d Sensors -Q "SELECT TOP 10 * FROM dbo.v_monitor_daily ORDER BY day DESC"

x-sa-password: &sa_password "Local-Dev-Only-1!"

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: *sa_password
    ports: ["1433:1433"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      db: { condition: service_healthy }
    environment:
      SA_PASSWORD: *sa_password
    entrypoint: ["/bin/bash", "-c", "/opt/mssql-tools18/bin/sqlcmd -C -S db -U sa -P \"$$SA_PASSWORD\" -Q \"IF DB_ID('Sensors') IS NULL CREATE DATABASE Sensors\""]
    restart: "no"

  fake-api:
    build: .
    command: ["fake-api", "--host", "0.0.0.0", "--port", "8080", "--monitors", "6"]
    ports: ["8080:8080"]

  collector:
    build: .
    command: ["daemon", "--config", "/app/config/collector.example.properties", "--run-now"]
    depends_on:
      db-init: { condition: service_completed_successfully }
      fake-api: { condition: service_started }
    volumes:
      - ./config:/app/config:ro
    environment:
      SDC_API_BASE_URL: http://fake-api:8080/api/v1
      SDC_DB_URL: jdbc:sqlserver://db:1433;databaseName=Sensors;encrypt=true;trustServerCertificate=true;useBulkCopyForBatchInsert=true
      SDC_DB_USER: sa
      SDC_DB_PASSWORD: *sa_password
      SDC_COLLECTION_INITIAL_START_DATE: "2025-06-01"
